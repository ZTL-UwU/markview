format_version = 1
version = 1

[[fontdef]]
id = "serif"
lookfor = ["Noto Serif", "Noto Serif CJK SC", "Source Serif 4", "serif"]

[[fontdef]]
id = "sans-serif"
lookfor = ["Noto Sans", "Noto Sans CJK SC", "Source Han Sans CJK SC", "Source Han Sans", "sans-serif"]

[[fontdef]]
id = "monospace"
lookfor = ["Noto Sans Mono", "Consolas", "Fira Code", "monospace"]

[meta]
name = "Light"
description = "Markview's default light stylesheet"
[body]
color = "#262B30"
background = "#FAFAF8"
font = [{ family = "serif" }]
line_height = 1.65
[p]
space_after = 0.8
[h1]
size = 1.9
weight = 700
space_before = 0.17
space_after = 0.8
font = [{ family = "sans-serif" }]
[h2]
size = 1.5
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }]
[h3]
size = 1.25
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }]
[h4]
size = 1.1
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }]
[h5]
size = 1.0
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }]
[h6]
size = 0.95
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }]
[em]
font = [{ family = "serif", variant = "italic" }]
[strong]
weight = 700
[link]
color = "#315D86"
[link.hover]
color = "#1F4568"
[del]
decoration = ["line-through"]
[sup]
size = 0.7
[code]
font = [{ family = "monospace" }]
size = 0.9
background = "#EFF1F3"
[code_block]
font = [{ family = "monospace" }]
size = 0.9
line_height = 1.6
background = "#EFF1F3"
padding = [0.67, 0.78, 0.67, 0.78]
space_after = 0.8
[code_block.label]
color = "#69747E"
font = [{ family = "sans-serif" }]
size = 0.67
[blockquote]
border_color = "#315D86"
border_width = 3.0
padding = [0.22, 0.22, 0.22, 1.1]
space_after = 0.8
[list]
space_after = 0.8
[list.marker]
color = "#69747E"
size = 0.9
[task_marker]
color = "#315D86"
background = "#FAFAF8"
border_color = "#315D86"
[footnote]
size = 0.88
space_after = 0.8
[table]
size = 0.9
border_color = "#D8DEE3"
border_width = 1.0
space_after = 0.8
[table.cell]
padding = [0.44, 0.67, 0.44, 0.67]
[table.header]
weight = 700
background = "#EFF1F3"
[hr]
color = "#D8DEE3"
border_width = 1.0
space_before = 0.5
space_after = 0.8
[selection]
background = "#315D8647"
[scrollbar]
track = "#D8DEE3"
thumb = "#69747E"
thumb_hover = "#315D86"
[ui]
color = "#262B30"
background = "#FAFAF8"
font = [{ family = "sans-serif" }]
muted = "#69747E"
accent = "#315D86"
border_color = "#D8DEE3"
error = "#A13F3F"
shadow = "#1019232E"
scrim = "#1019233D"
[ui.panel]
background = "#F3F6F9F0"
[ui.button]
background = "#EFF1F3"
hover_background = "#E0E7EF"
active_background = "#D3DDE8"
disabled_color = "#69747E"
focus_color = "#315D86"
