[package]
name = "markview"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native, read-only Markdown reader with optimized paragraph layout"
license = "MIT"

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
comrak = { version = "0.55", default-features = false }
hypher = { version = "0.1.7", default-features = false, features = ["english", "alloc"] }
icu_segmenter = "2.3"
notify = "8.2"
parley = { version = "0.11.1", features = ["complex-scripts"] }
pollster = "0.4"
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-font = "=0.1.14"
ratex-katex-fonts = "=0.1.14"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = "0.2.9"
tiny-skia = "0.11"
wgpu = { version = "29.0.4", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "metal", "dx12", "wgsl"] }
winit = "0.30.13"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[bin]]
name = "markview"
path = "src/main.rs"
