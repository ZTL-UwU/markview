[package]
name = "markview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A native, read-only Markdown reader with optimized paragraph layout"
license.workspace = true
publish = false

[lints]
workspace = true

[workspace]
members = ["crates/markview-core", "crates/markview-render"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
unicode-segmentation = "1.13"
tempfile = "3"
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
comrak = { version = "0.55", default-features = false }
hypher = { version = "0.1.7", default-features = false, features = ["english", "alloc"] }
icu_segmenter = "2.3"
notify = "8.2"
open = "5.4"
parley = { version = "0.11.1", features = ["complex-scripts"] }
pollster = "0.4"
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-font = "=0.1.14"
ratex-katex-fonts = "=0.1.14"
rfd = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
swash = "0.2.9"
tiny-skia = "0.11"
wgpu = { version = "29.0.4", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "metal", "dx12", "wgsl"] }
winit = "0.30.13"

[dependencies]
toml_edit = { version = "0.25", features = ["serde"] }
arboard.workspace = true
markview-core = { path = "crates/markview-core" }
markview-render = { path = "crates/markview-render" }
anyhow.workspace = true
notify.workspace = true
open.workspace = true
pollster.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu.workspace = true
winit.workspace = true

tempfile.workspace = true


[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[[bin]]
name = "markview"
path = "src/main.rs"
