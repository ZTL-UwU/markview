format_version = 1
version = 1

[[fontdef]]
id = "serif"
lookfor = ["Georgia", "Times New Roman", "Noto Serif", "DejaVu Serif", "Liberation Serif", "Linux Libertine", "serif"]

[[fontdef]]
id = "sans-serif"
lookfor = ["Helvetica", "Arial", "Noto Sans", "DejaVu Sans", "Liberation Sans", "Ubuntu", "sans-serif"]

[[fontdef]]
id = "serif[cjk]"
type = "SC"
lookfor = ["Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "SimSun", "NSimSun", "STSong", "AR PL UMing CN", "AR PL SungtiL GB", "serif"]

[[fontdef]]
id = "serif[cjk]"
type = "TC"
lookfor = ["Noto Serif CJK TC", "Source Han Serif TC", "Songti TC", "PMingLiU", "AR PL UMing TW", "serif"]

[[fontdef]]
id = "serif[cjk]"
type = "JP"
lookfor = ["Noto Serif CJK JP", "Source Han Serif JP", "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", "MS PMincho", "MS Mincho", "serif"]

[[fontdef]]
id = "sans-serif[cjk]"
type = "SC"
lookfor = ["PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans CJK SC", "Source Han Sans", "Founder Lan Ting Hei", "WenQuanYi Micro Hei", "Hiragino Sans GB", "Heiti SC", "sans-serif"]

[[fontdef]]
id = "sans-serif[cjk]"
type = "TC"
lookfor = ["Noto Sans CJK TC", "Source Han Sans CJK TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", "WenQuanYi Micro Hei", "sans-serif"]

[[fontdef]]
id = "sans-serif[cjk]"
type = "JP"
lookfor = ["Noto Sans CJK JP", "Source Han Sans CJK JP", "Hiragino Sans", "Yu Gothic", "Meiryo", "sans-serif"]

[[fontdef]]
id = "monospace"
lookfor = ["Fira Code", "Consolas", "Noto Sans Mono", "monospace"]

[[fontdef]]
id = "monospace[cjk]"
type = "SC"
lookfor = ["Noto Sans Mono CJK SC", "Source Han Mono", "Source Code Pro", "monospace"]

[[fontdef]]
id = "emoji"
lookfor = ["Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", "Twemoji Mozilla", "EmojiOne Color", "JoyPixels", "Twitter Color Emoji", "EmojiSymbols"]

[meta]
name = "Light"
description = "Markview's default light stylesheet"

[body]
color = "#262B30"
background = "#FAFAF8"
# Emoji fonts usually have only a regular face, even inside strong text.
font = [{ family = "serif" }, { family = "serif[cjk]" }, { family = "emoji", weight = 400 }]
line_height = 1.65

[p]
space_after = 0.8

[h1]
size = 1.9
weight = 700
space_before = 0.17
space_after = 0.8
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[h2]
size = 1.5
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[h3]
size = 1.25
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[h4]
size = 1.1
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[h5]
size = 1.0
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[h6]
size = 0.95
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[em]
font = [
	{ family = "serif", variant = "italic" },
	{ family = "serif[cjk]", variant = "italic" },
	{ family = "emoji", weight = 400 },
]

[strong]
weight = 700

[link]
color = "#315D86"

[link.hover]
color = "#1F4568"

[del]
decoration = ["line-through"]

[sup]
size = 0.7

[code]
font = [{ family = "monospace" }, { family = "monospace[cjk]" }, { family = "emoji", weight = 400 }]
size = 0.9
background = "#EFF1F3"

[code_block]
theme = "InspiredGitHub"
font = [{ family = "monospace" }, { family = "monospace[cjk]" }, { family = "emoji", weight = 400 }]
size = 0.9
line_height = 1.6
background = "#EFF1F3"
padding = [0.67, 0.78, 0.67, 0.78]
space_after = 0.8

[code_block.label]
color = "#69747E"
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 0.67

[blockquote]
border_color = "#315D86"
border_width = 3.0
padding = [0.22, 0.22, 0.22, 1.1]
space_after = 0.8

[list]
indent = 0.5
space_after = 0.8

[enum]
indent = 0.5
space_after = 0.8

[list.marker]
color = "#69747E"
size = 0.9

[task_marker]
color = "#315D86"
background = "#FAFAF8"
border_color = "#315D86"

[footnote]
size = 0.88
space_after = 0.8

[table]
size = 0.9
border_color = "#D8DEE3"
border_width = 1.0
space_after = 0.8

[table.cell]
padding = [0.44, 0.67, 0.44, 0.67]

[table.header]
weight = 700
background = "#EFF1F3"

[hr]
color = "#D8DEE3"
border_width = 1.0
space_before = 0.5
space_after = 0.8

[selection]
background = "#315D8647"

[img]
align = "center"
padding = 0.0
border_width = 0.0
border_color = "#D8DEE3"
background = "#00000000"

[img.caption]
source = "title_or_alt"
align = "center"
size = 0.8
line_height = 1.4
space_before = 0.25
space_after = 0.0
color = "#69747E"

[img.placeholder]
size = 0.78
color = "#69747E"
background = "#EFF1F3"
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[scrollbar]
track = "#D8DEE3"
thumb = "#69747E"
thumb_hover = "#315D86"
thickness = 6.0
thickness_hover = 8.0
overflow_thickness = 6.0
overflow_thickness_hover = 8.0
gutter = 8.0

[ui]
color = "#262B30"
background = "#FAFAF8"
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
muted = "#69747E"
accent = "#315D86"
border_color = "#D8DEE3"
error = "#A13F3F"
shadow = "#1019232E"
scrim = "#1019233D"

[ui.panel]
background = "#F3F6F9F0"

[ui.button]
background = "#EFF1F3"
hover_background = "#E0E7EF"
active_background = "#D3DDE8"
disabled_color = "#69747E"
focus_color = "#315D86"
