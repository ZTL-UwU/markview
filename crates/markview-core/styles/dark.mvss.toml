format_version = 2
version = 1

[meta]
name = "Dark"
description = "Markview's default dark stylesheet"

[[rule]]
when = ["body"]
color = "#DDE2E7"
background = "#282c33"

[[rule]]
when = ["link"]
color = "#8FB9DD"

[[rule]]
when = ["link", "hover"]
color = "#B7D8F2"

[[rule]]
when = ["code"]
background = "#2A3139"

[[rule]]
when = ["code_block"]
background = "#2A3139"
theme = "base16-ocean.dark"

[[rule]]
when = ["code_block", "label"]
color = "#98A5B1"

[[rule]]
when = ["blockquote"]
border_color = "#8FB9DD"

[[rule]]
when = ["marker"]
color = "#98A5B1"

[[rule]]
when = ["task_marker"]
color = "#8FB9DD"
background = "#282c33"
border_color = "#8FB9DD"

[[rule]]
when = ["table", "cell"]
border_color = "#414C58"

[[rule]]
when = ["table", "header"]
background = "#2A3139"

[[rule]]
when = ["hr"]
color = "#414C58"

[[rule]]
when = ["selection"]
background = "#8FB9DD47"

[[rule]]
when = ["img"]
border_color = "#414C58"

[[rule]]
when = ["img", "caption"]
color = "#98A5B1"

[[rule]]
when = ["img", "placeholder"]
color = "#98A5B1"
background = "#2A3139"

[[rule]]
when = ["scrollbar"]
track = "#00000000"
thumb = "#c8ccd44c"
thumb_hover = "#363c46"

[[rule]]
when = ["ui"]
color = "#dce0e5"
background = "#2f343e"
muted = "#a9afbc"
accent = "#74ade8"
border_color = "#464b57"
error = "#d07277"
shadow = "#00000066"
scrim = "#00000080"

[[rule]]
when = ["ui", "toolbar"]
background = "#2f343e"
hover_background = "#363c46"
active_background = "#282c33"
border_color = "#464b57"

[[rule]]
when = ["ui", "statusbar"]
background = "#3b414d"
border_color = "#464b57"
muted = "#a9afbc"

[[rule]]
when = ["ui", "panel"]
background = "#2f343e"
border_color = "#464b57"

[[rule]]
when = ["ui", "button"]
background = "#00000000"
hover_background = "#363c46"
active_background = "#454a56"
disabled_color = "#878a98"
focus_color = "#74ade8"
border_color = "#74ade8"
color = "#dce0e5"
