[package]
name = "markview-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
serde.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
parley.workspace = true
pollster.workspace = true
ratex-font.workspace = true
ratex-katex-fonts.workspace = true
ratex-types.workspace = true
swash.workspace = true
tiny-skia.workspace = true
winit.workspace = true
markview-core = { path = "../markview-core" }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }

[lints]
workspace = true
